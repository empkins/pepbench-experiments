[project]
name = "pepbench-experiments"
version = "0.1.0"
description = "Research experiments, notebooks, and results built on top of pepbench and biopsykit."
authors = [
    { name = "Robert Richer", email = "robert.richer@fau.de" },
    { name = "Luca Abel", email = "luca.abel@fau.de" },
]
requires-python = ">=3.10,<4.0"
readme = "README.md"
license = "MIT"
dependencies = [
    # Pin a released pepbench version - never a path or git dependency, so this repo tracks a stable,
    # reproducible library version instead of moving in lockstep with pepbench's own working tree.
    "pepbench>=0.3.0",
    "biopsykit>=0.14.0",
    "tpcp>=2",
    "scikit-learn>=1.2.0",
    "skops>=0.11",
    "shap>=0.47.2",
    "pandas>=2.0.0",
    "numpy>=1.26,<2",
    "pingouin>=0.5.2,<0.6",
    "seaborn>=0,<1",
    "matplotlib<3.9",
    "fau-colors~=1.1",
    "pooch>=1.8.2",
    "jinja2>=3.1.4,<4",
    "hpc-helper>=0.3.2",
    "jupyter>=1.1.1",
]

[project.urls]
Homepage = "https://github.com/empkins/pepbench-experiments"
Repository = "https://github.com/empkins/pepbench-experiments"

[tool.uv.sources]
# Local development: use the editable pepbench checkout next to this repo instead of the PyPI release.
# Remove this before releasing, so the lockfile pins a released pepbench version again.
pepbench = { path = "../pepbench", editable = true }

[dependency-groups]
dev = [
    "black>=25",
    "ruff>=0,<1",
    "ipykernel>=6,<7",
    "poethepoet>=0.33.0",
]

[tool.hatch.build.targets.wheel]
include = [
    "b_point_ml_experiments/src/b_point_ml_experiments",
]

[tool.hatch.build.targets.wheel.sources]
"b_point_ml_experiments/src" = ""

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 120
target-version = ['py310']

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.poe.tasks]
_format = "ruff format ."
_auto_fix = "ruff check . --fix-only --show-fixes --exit-zero"
_auto_fix_unsafe = "ruff check . --fix-only --show-fixes --exit-zero --unsafe-fixes"
format = ["_auto_fix", "_format"]
format_unsafe = ["_auto_fix_unsafe", "_format"]
lint = { cmd = "ruff check . --fix", help = "Lint all files with ruff." }
_lint_ci = "ruff check . --output-format=github"
_check_format = "ruff format . --check"
ci_check = { sequence = ["_check_format", "_lint_ci"], help = "Check all potential format and linting issues." }
conf_jupyter = { cmd = "python -m ipykernel install --user --name pepbench-experiments --display-name pepbench-experiments", help = "Add a new jupyter kernel for the project."}
remove_jupyter = { cmd = "jupyter kernelspec uninstall pepbench-experiments", help = "Remove the project specific jupyter kernel."}
